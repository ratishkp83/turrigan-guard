<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Turrigan Guard mark: the Turrigan gold "T" (with keyhole) on a sentry shield.
       Brand palette: sentinel gold #e8b64c on graphite-navy #0b1220. -->
  <!-- Shield (guard) -->
  <path d="M36 18 L92 18 Q106 18 106 32 L106 66 Q106 96 64 116 Q22 96 22 66 L22 32 Q22 18 36 18 Z"
        fill="#0b1220" stroke="#e8b64c" stroke-width="5" stroke-linejoin="round"/>
  <!-- Turrigan "T" -->
  <g fill="#e8b64c">
    <rect x="41" y="40" width="46" height="13" rx="2"/>
    <rect x="57" y="40" width="14" height="50" rx="2"/>
  </g>
  <!-- Keyhole cut into the stem (negative space = shield colour; the "guard" cue) -->
  <g fill="#0b1220">
    <circle cx="64" cy="60" r="4.5"/>
    <rect x="62" y="60" width="4" height="12"/>
  </g>
</svg>
